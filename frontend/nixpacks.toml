# Nixpacks tells Railway which Node version to use for the React build.
# nodejs_22 pulls Node 22.x — some tooling in the CRA/ESLint chain
# requires Node 20.19+ or 22, and pinning to 22 keeps things clean.
[phases.setup]
nixPkgs = ["nodejs_22", "yarn"]

[phases.install]
# Clear stale tarballs from the persistent yarn cache mount *without*
# unlinking the mount root itself (that fails with EBUSY on Railway's
# Docker cache volume). `find ... -mindepth 1 -delete` empties the
# contents in place. The `|| true` keeps the build going on the first
# deploy when the cache dir doesn't exist yet.
#
# The `--network-timeout 600000` bumps yarn's default 30s to 10 min to
# survive Railway's occasionally-throttled builder network — the root
# cause of partial-download corruption we hit Feb 2026.
cmds = [
  "find /usr/local/share/.cache/yarn/v6 -mindepth 1 -delete 2>/dev/null || true",
  "yarn install --frozen-lockfile --network-timeout 600000",
]

[phases.build]
# Explicitly set NODE_ENV=production during build so craco/react-scripts
# emit a real production bundle (no react-refresh, no dev HMR runtime).
#
# Nuke `node_modules/.cache` first — Nixpacks mounts that directory as a
# persistent Docker cache, which means CRA's webpack cache from previous
# builds sticks around and can retain stale module resolutions after a
# yarn.lock change (e.g. an icon rename that IS in the new package but
# whose stale cache entry references a name from an older one). Deleting
# the dir on every build makes each deploy a clean-slate build, at the
# cost of ~15s slower first-compile — worth it for reliable icon
# resolution against fresh lucide-react.
cmds = [
  "rm -rf node_modules/.cache 2>/dev/null || true",
  "NODE_ENV=production yarn build",
]

[start]
# `serve` is a tiny static file server; -s makes it SPA-friendly (all
# unknown routes fall back to index.html so React Router works).
cmd = "npx --yes serve -s build -l $PORT"
